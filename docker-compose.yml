services:
  sirius-pulse:
    build:
      context: .
      args:
        SIRIUS_ENV_CACHE_IMAGE: ${SIRIUS_ENV_CACHE_IMAGE:-environment}
        SIRIUS_BROWSER_CACHE_IMAGE: ${SIRIUS_BROWSER_CACHE_IMAGE:-browser-empty}
        SIRIUS_ENV_CACHE_KEY: ${SIRIUS_ENV_CACHE_KEY:-}
    image: sirius-pulse:latest
    container_name: sirius-pulse-v2-test
    restart: unless-stopped
    mem_limit: 12g
    memswap_limit: 14g
    network_mode: host
    environment:
      SIRIUS_PULSE_HOME: /app
      SIRIUS_PULSE_FILE_ROOT: /
      # Optional examples for github_monitor. The Plugin setting must reference
      # these exact names; map any custom *_env names in an uncommitted override.
      SIRIUS_GITHUB_TOKEN_SIRIUS_PULSE: ${SIRIUS_GITHUB_TOKEN_SIRIUS_PULSE:-}
      SIRIUS_GITHUB_WEBHOOK_SECRET: ${SIRIUS_GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - ./data:/app/data
      # External plugin source and _config.json remain on the host.
      - ./plugins:/app/plugins:rw
      - ${SIRIUS_CONTAINER_ADMIN_SOCKET:-/dev/null}:/run/sirius-container-admin.sock:ro
    command: ["run"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
