name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          # External plugin tests live in the plugins submodule.
          submodules: recursive
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install only the framework test extra; plugin tests use mocked
          # transports and must not trigger plugin dependency installation.
          pip install -e .[test]
      
      - name: Run tests with pytest
        run: |
          pytest -q --tb=short --cov=sirius_pulse --cov-report=xml

      - name: Validate external plugin syntax and metadata
        run: |
          # This is intentionally scoped to syntax plus manifest/class parity;
          # behavior is covered by the complete external Plugin test suite.
          python -m compileall -q plugins/github_monitor
          python - <<'PY'
          import ast
          import json
          import pathlib
          import tomllib

          root = pathlib.Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          manifest = json.loads(
              (root / "plugins/github_monitor/plugin.json").read_text(encoding="utf-8")
          )
          tree = ast.parse(
              (root / "plugins/github_monitor/__init__.py").read_text(encoding="utf-8")
          )
          declared = {}
          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id in {
                      "_plugin_version",
                      "_plugin_min_framework_version",
                      "_plugin_dependencies",
                  }:
                      declared[target.id] = ast.literal_eval(node.value)
          def numeric_version(value):
              parts = [int(part) for part in value.split(".")]
              return tuple((parts + [0, 0, 0])[:3])

          assert manifest["version"] == declared["_plugin_version"]
          assert manifest["min_framework_version"] == declared["_plugin_min_framework_version"]
          assert numeric_version(project["project"]["version"]) >= numeric_version(
              manifest["min_framework_version"]
          )
          assert manifest["dependencies"] == declared["_plugin_dependencies"]
          PY

      - name: Run external plugin tests
        run: |
          # Tests use mocked transports and do not invoke PluginLoader's
          # runtime dependency installer.
          pytest -q plugins/tests --tb=short
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella

  docs:
    name: Build VitePress documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # docs itself is a submodule and may link to the external plugins tree.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run build --prefix docs

  webui:
    name: WebUI build is committed and fresh
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install WebUI dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Type-check and build WebUI
        run: pnpm --dir frontend build

      # 构建产物随包提交（源码与 Docker 用户无需 Node）：改了 frontend/ 却忘了重新构建，
      # 线上跑的就会是旧页面。这里重建一遍，必须与提交的一致。
      - name: Committed build matches sources
        run: |
          git status --porcelain sirius_pulse/webui/app
          test -z "$(git status --porcelain sirius_pulse/webui/app)"

  lint:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Lint with pylint
        continue-on-error: true
        run: |
          pylint sirius_pulse --fail-under=8.0 --disable=C0111,W0212
      
      - name: Format check with black
        run: |
          black --check --fast sirius_pulse tests
      
      - name: Import sorting check with isort
        run: |
          isort --check-only sirius_pulse tests
      
      - name: Type check with mypy
        continue-on-error: true
        run: |
          mypy sirius_pulse --ignore-missing-imports

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install bandit
      
      - name: Security scan with bandit
        continue-on-error: true
        run: |
          bandit -r sirius_pulse -ll

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [ test, lint, docs ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          # External Plugin source must never enter the core distribution.
          submodules: false
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Validate Docker Compose contract
        run: docker compose -f docker-compose.yml config --quiet
      
      - name: Build distribution
        run: |
          python -m build
      
      - name: Verify distribution
        run: |
          python -m twine check dist/*

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          wheel_names = zipfile.ZipFile(wheel).namelist()
          sdist_names = tarfile.open(sdist, "r:gz").getnames()
          assert any(name.endswith("entry_points.txt") for name in wheel_names)
          assert any(name.endswith("sirius_pulse/webui/static/index.html") for name in wheel_names)
          assert any(name.endswith("sirius_pulse/webui/app/index.html") for name in wheel_names)
          forbidden = (
              "plugins/github_monitor/",
              "sirius_pulse/github/",
              "sirius_pulse/tools/builtin/github_monitor.py",
          )
          for archive_name, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              normalized = [name.replace("\\", "/") for name in names]
              for marker in forbidden:
                  assert not any(marker in name for name in normalized), (
                      f"{archive_name} unexpectedly contains {marker}"
                  )
          PY
      
      - name: Store built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
